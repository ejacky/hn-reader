<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>HN Reader</h1>
  </div>

  <div class="connection-bar">
    <span id="connIndicator">●</span>
    <span id="connText">检测中...</span>
  </div>

  <div class="section preload-toggle">
    <div class="preload-toggle-label">
      <span class="preload-toggle-title">自动加载摘要</span>
      <span class="preload-toggle-desc">打开页面时自动加载前 15 条</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="autoPreloadToggle">
      <span class="slider"></span>
    </label>
  </div>

  <!-- Cloud 模式视图 -->
  <div id="cloudSection" style="display:none;">
    <div class="section">
      <label>账户状态</label>
      <div id="cloudAccountStatus" class="account-status">匿名账户</div>
    </div>

    <div class="section">
      <label>Summary Language</label>
      <select id="cloudLanguage">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="section" id="quotaSection" style="display:none;">
      <label>本月额度</label>
      <div class="quota-bar">
        <div id="quotaFill" class="quota-fill"></div>
      </div>
      <div id="quotaText" class="quota-text"></div>
    </div>

    <div class="section upgrade-card" id="upgradeCard" style="display:none;">
      <div class="upgrade-title">本月免费额度已用完</div>
      <div class="upgrade-desc">升级到 Pro 继续享受无限摘要和高级匹配。</div>
      <button id="upgradeBtn" class="upgrade-btn">升级到 Pro</button>
    </div>

    <div class="section upgrade-card upgrade-warning" id="quotaWarning" style="display:none;">
      <div class="upgrade-title">额度即将用完</div>
      <div class="upgrade-desc">接近限额时建议升级，避免影响使用。</div>
      <button id="upgradeWarningBtn" class="upgrade-btn">查看方案</button>
    </div>

    <div class="actions">
      <button id="saveCloudBtn">保存设置</button>
    </div>

    <div class="advanced-link">
      <a href="#" id="switchToLocalBtn">高级：使用本地服务</a>
    </div>

    <div class="section" id="cloudStatsSection" style="display:none;">
      <h2>Your Stats</h2>
      <div id="cloudStatsContent"></div>
    </div>

    <div class="section" id="cloudRecSection" style="display:none;">
      <h2>Recommendations</h2>
      <div id="cloudRecContent"></div>
    </div>
  </div>

  <!-- Local 模式视图 -->
  <div id="localSection" style="display:none;">
    <div class="section">
      <label>Server URL</label>
      <input type="text" id="serverUrl" placeholder="http://localhost:8080" />
    </div>

    <div class="section">
      <label>Summary Language</label>
      <select id="localLanguage">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="actions">
      <button id="saveLocalBtn">保存设置</button>
    </div>

    <div class="guide-card" id="localGuide" style="display:none;">
      <p>未检测到本地服务。</p>
      <a id="downloadLink" href="https://github.com/ejacky/hn-reader/releases/latest" target="_blank">
        <button class="download-btn">下载 HN Reader 服务端</button>
      </a>
    </div>

    <div class="advanced-link">
      <a href="#" id="switchToCloudBtn">切换回云服务</a>
    </div>

    <div class="section" id="localStatsSection" style="display:none;">
      <h2>Your Stats</h2>
      <div id="localStatsContent"></div>
    </div>

    <div class="section" id="localRecSection" style="display:none;">
      <h2>Recommendations</h2>
      <div id="localRecContent"></div>
    </div>
  </div>

  <div id="status"></div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
