name: Extension i18n

on:
  push:
    branches: [main, dev]
    paths:
      - 'extension/**'
      - 'scripts/check-i18n.mjs'
      - '.github/workflows/extension-i18n.yml'
  pull_request:
    paths:
      - 'extension/**'
      - 'scripts/check-i18n.mjs'
      - '.github/workflows/extension-i18n.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check locale catalogs
        run: node scripts/check-i18n.mjs

  # extension-only 推送不会触发 cloud-server 的 paths，所以 close-issues 也要在
  # 这里挂一份：check 绿之后才按 Done #N 关闭。
  close-issues:
    needs: [check]
    if: github.ref == 'refs/heads/main' && needs.check.result == 'success'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/close-issues.yml
