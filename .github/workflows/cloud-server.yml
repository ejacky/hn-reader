name: Build and Push Cloud Server

on:
  push:
    branches: [main, dev]
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/cloud-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/cloud-server.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-cloud

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum

      - name: Test (local mode)
        run: go test ./...

      - name: Test (cloud mode)
        run: go test -tags cloud ./...

      - name: Vet (cloud mode)
        run: go vet -tags cloud ./...

      - name: Build cloud binary
        run: go build -tags cloud -trimpath -o /tmp/cloud-server ./cmd/hn-reader-cloud

      - name: Ensure cloud build requires the cloud tag
        run: |
          if go build -o /tmp/cloud-server-no-tag ./cmd/hn-reader-cloud 2>/dev/null; then
            echo "::error::cloud server built without -tags cloud; this would ship the local no-op auth"
            exit 1
          fi
          echo "OK: cloud binary requires -tags cloud"

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
