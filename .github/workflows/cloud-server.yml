name: Build and Push Cloud Server

on:
  push:
    branches: [main, dev]
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/cloud-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/cloud-server.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-cloud

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum

      - name: Test (local mode)
        run: go test ./...

      - name: Test (cloud mode)
        run: go test -tags cloud ./...

      - name: Vet (cloud mode)
        run: go vet -tags cloud ./...

      - name: Build cloud binary
        run: go build -tags cloud -trimpath -o /tmp/cloud-server ./cmd/hn-reader-cloud

      - name: Ensure cloud build requires the cloud tag
        run: |
          if go build -o /tmp/cloud-server-no-tag ./cmd/hn-reader-cloud 2>/dev/null; then
            echo "::error::cloud server built without -tags cloud; this would ship the local no-op auth"
            exit 1
          fi
          echo "OK: cloud binary requires -tags cloud"

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 关闭是 GitHub 在这套流程里唯一做错的一环：带 "Closes #12" 的提交一到默认分支，
  # issue 当场就关，比测试早，红了也照关。这个 job 才是"真的做完了"的那一刻——
  # 本地与云模式两套测试、vet 都绿之后。
  #
  # 所以标记用 "Done #18" 而不是 GitHub 的关键词：关键词是我们自己的，没有别人能
  # 替我们决定什么时候算完成。同一个提交里裸写 "#18" 仍然会给 issue 留下交叉引用，
  # 那是 GitHub 这块行为里值得保留的部分。
  #
  # 推送是单位，不是单个提交：一个修复和证明它的测试常常是两个提交一起推，CI 看到
  # 的本来就是同一个 run。
  close-issues:
    name: Close the issues this push finishes
    needs: [build]
    # 只在 main，且只在检查全绿时：这里的"完成"意味着测过，这才是关闭的理由。
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: close what the commit messages say they close
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # "Done #18"——唯一的标记。裸 "#18" 或 "Refs #18" 是提交在指一个它还没
          # 做完的任务，按那些关就把"提及"变成了"改状态"。GitHub 自己的关键词刻意
          # 不接受：这个 job 跑起来时 issue 早被那次推送关掉了，测没测都一样。
          numbers="$(
            jq -r '.commits[]?.message' "$GITHUB_EVENT_PATH" |
              grep -oiE '\bdone\b[[:space:]]*:?[[:space:]]*#[0-9]+' |
              grep -oE '[0-9]+$' | sort -un || true
          )"
          if [ -z "$numbers" ]; then
            echo "no Done #N marker in this push; nothing to close"
            exit 0
          fi
          echo "Done markers: $numbers"

          for number in $numbers; do
            # 先读再写。gh issue close 对 PR 编号会失败；已经关掉的必须原样放过，
            # 这样重推（变基、重试）不会留下第二条评论。不存在的编号也不能拖垮
            # 整个 job：提交信息是自由文本。
            if ! resource="$(gh api "repos/$REPO/issues/$number" \
                 --jq '.state + " " + (if .pull_request then "pull request" else "issue" end)' 2>/dev/null)"; then
              echo "#$number does not exist in $REPO; skipping"
              continue
            fi
            if [ "$resource" != "open issue" ]; then
              echo "#$number is $resource; skipping"
              continue
            fi
            gh issue close "$number" --repo "$REPO" --reason completed \
              --comment "本地与云模式测试、vet 全部通过（提交 \`$HEAD_SHA\`，[CI 运行]($RUN_URL)），按提交信息里的 \`Done #$number\` 标记自动关闭。"
            echo "#$number closed"
          done
