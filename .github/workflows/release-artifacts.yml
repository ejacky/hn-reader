# 每个 v* tag 自动产出发布物：Windows 安装包 + 扩展包 + 校验和。
#
# 为什么是 windows-latest：安装包本来就是 Windows 产物，installer/setup.nsi 里
# File "..\server\hn-reader.exe" 用的是反斜杠路径，在 Windows 上不需要改写脚本；
# 同时也顺带验证了"把 exe 跑起来、/health 报的版本等于 tag"这件事。
#
# 为什么 tag 只出制品：生产部署是另一条人工触发的流水线（见 #12），tag 是制品
# 指针而不是上线开关。
name: Release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要重新打包并上传的 tag（例如 v1.3.0）'
        required: true

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum

      - name: Derive version from tag
        shell: pwsh
        run: |
          $v = $env:TAG -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "tag '$env:TAG' is not vX.Y.Z" }
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "version: $v"

      - name: Build local server (windows/amd64)
        working-directory: server
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags "-s -w -X main.Version=$env:VERSION" -o hn-reader.exe ./cmd/hn-reader
          Get-Item hn-reader.exe | Select-Object Name, Length

      # 打包前先证明这个二进制真的报 tag 的版本，避免把旧包发出去。
      - name: Verify the binary reports the tag version
        working-directory: server
        shell: pwsh
        run: |
          $env:PORT = '18080'
          $p = Start-Process -FilePath (Join-Path $PWD 'hn-reader.exe') -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $h = Invoke-RestMethod 'http://127.0.0.1:18080/health' -TimeoutSec 2
              if ($h.version -eq $env:VERSION) { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "hn-reader.exe did not report version $env:VERSION" }
          Write-Host "OK: /health reports $env:VERSION"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress | Out-Null
          $candidates = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe'
          ) + @((Get-Command makensis.exe -ErrorAction SilentlyContinue).Source)
          $nsis = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $nsis) { throw 'makensis not found after choco install' }
          "MAKENSIS=$nsis" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "makensis: $nsis"

      # 用 cmd /c 传入，避免 PowerShell 把 /DPRODUCT_VERSION=1.3.0 拆成两个参数
      - name: Build installer
        working-directory: installer
        shell: pwsh
        run: |
          cmd /c "`"$env:MAKENSIS`" -INPUTCHARSET UTF8 /DPRODUCT_VERSION=$env:VERSION setup.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }
          $exe = "HNReader-Setup-$env:VERSION.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not produced" }
          Get-Item $exe | Select-Object Name, Length

      - name: Package extension (versioned file name)
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'ext'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item extension $stage -Recurse
          Remove-Item (Join-Path $stage 'extension.zip') -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $PWD "dist/HNReader-extension-$env:VERSION.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage, $zip)
          Get-Item $zip | Select-Object Name, Length

      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          $files = @("installer/HNReader-Setup-$env:VERSION.exe", "dist/HNReader-extension-$env:VERSION.zip")
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -Encoding ascii dist/SHA256SUMS
          Get-Content dist/SHA256SUMS

      - name: Upload to the release
        shell: pwsh
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title $env:TAG --generate-notes
          }
          gh release upload $env:TAG "installer/HNReader-Setup-$env:VERSION.exe" "dist/HNReader-extension-$env:VERSION.zip" dist/SHA256SUMS --clobber
          gh release view $env:TAG --json assets --jq '.assets[] | "\(.name) \(.size)"'

  # 发版记录。close-issues 说的是 issue *做完了*，没人说是哪个版本发出去的，
  # "v0.2.0 里有什么"就只能靠翻 git 历史。
  #
  # 只认标记：一个版本里的 issue，就是 Done #N 落在 previous..tag 区间里的那些，
  # 和关闭用的是同一个信号。没有按关闭时间划窗口，也没有推断，所以 milestone
  # 不会和它声称包含的 issue 打架。
  #
  # 这个仓库的 tag 是制品指针（生产部署是人工流水线），所以等 package 绿就够，
  # 不等部署。
  mark-release:
    name: Put this release's issues in its milestone
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe 要读 tag，浅克隆一个都没有。
          fetch-depth: 0

      - name: fill the milestone
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # 上一个版本是本次 tag 之前最近的那个 v* tag。第一次打 tag 时没有，
          # 整个历史就是区间。
          if previous="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null)"; then
            range="${previous}..${TAG}"
          else
            previous=""
            range="${TAG}"
          fi
          echo "release ${TAG}: issues from ${previous:-the first commit}..${TAG}"

          numbers="$(
            git log --format='%B' "$range" |
              grep -oiE '\bdone\b[[:space:]]*:?[[:space:]]*#[0-9]+' |
              grep -oE '[0-9]+$' | sort -un || true
          )"
          if [ -z "$numbers" ]; then
            echo "no Done #N marker in this release; nothing to record"
            exit 0
          fi

          # 同名 milestone 开着的关着的都复用：提前规划的版本已经有它，再建一个
          # 会把同一个版本劈成两半。
          milestone="$(gh api "repos/$REPO/milestones?state=all&per_page=100" \
            --jq ".[] | select(.title == \"$TAG\") | .number" || true)"
          if [ -z "$milestone" ]; then
            milestone="$(gh api "repos/$REPO/milestones" --method POST \
              -f title="$TAG" --jq .number)"
            echo "created the milestone $TAG (#$milestone)"
          else
            echo "the milestone $TAG already exists (#$milestone)"
          fi

          for number in $numbers; do
            # 先读再写。规划时手工设过 milestone 的 issue 是人的决定，这个 job 不能
            # 覆盖；红了之后重开的 issue，打个 tag 也不该把它算回版本里。
            resource="$(gh api "repos/$REPO/issues/$number" \
              --jq '"\(.state) \(.milestone.number // 0) \(.pull_request != null)"' 2>/dev/null)" ||
              { echo "#$number does not exist; skipping"; continue; }
            read -r state current is_pull_request <<< "$resource"
            if [ "$is_pull_request" = "true" ]; then
              echo "#$number is a pull request; skipping"
              continue
            fi
            if [ "$state" != "closed" ]; then
              echo "#$number is $state; skipping"
              continue
            fi
            if [ "$current" != "0" ]; then
              echo "#$number already has milestone $current; skipping"
              continue
            fi
            gh api "repos/$REPO/issues/$number" --method PATCH \
              -F milestone="$milestone" > /dev/null
            echo "#$number -> $TAG"
          done
