# HN Reader Cloud on h43 (43.142.113.109) — https://hn-reader.whoareyou.ren
#
# Layout on the host:
#   /root/hn-reader/
#     docker-compose.yml
#     Dockerfile
#     hn-reader-cloud          # linux/amd64 binary, built with -tags cloud
#     .env                     # chmod 600; not in git
#     backups/
#
# Caddy (the existing simpletimetracker-web stack) terminates TLS and proxies
# hn-reader.whoareyou.ren to hn-reader-server:8080 over the STT compose network.
# The server is NOT published publicly; 127.0.0.1:8082 is a loopback-only debug
# port for smoke tests and pg_dump-style operations.
name: hn-reader

services:
  db:
    # Pin the digest after the first pull on this host:
    #   docker image inspect postgres:16-alpine --format '{{range .RepoDigests}}{{println .}}{{end}}'
    image: postgres:16-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
    container_name: hn-reader-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hn_reader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hn_reader
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hn_reader -d hn_reader"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    image: hn-reader-cloud:1.2.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hn-reader-server
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://hn_reader:${POSTGRES_PASSWORD}@db:5432/hn_reader?sslmode=disable
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-pro}
    ports:
      # Loopback only: Caddy reaches the container by name over `edge`.
      - "127.0.0.1:8082:8080"
    networks:
      - internal
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
  edge:
    external: true
    # Created by the STT compose project; Caddy is already attached to it.
    name: simpletimetracker-web_default

volumes:
  pgdata:
